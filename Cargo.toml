[package]
name = "atelier"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Luis Carlos Quesada <luiscarlosquesada@gmail.com>"]
description = "A focused native IDE without built-in AI"
repository = "https://github.com/Solrak97/atelier"
readme = "README.md"
publish = false

[workspace]
members = ["crates/atelier-core"]
resolver = "3"

[dependencies]
atelier-core = { path = "crates/atelier-core" }
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "490aad88d5c754e4b0fbbb2bf1e3d6936df27729" }
gpui_platform = { git = "https://github.com/zed-industries/zed.git", rev = "490aad88d5c754e4b0fbbb2bf1e3d6936df27729", features = [
    "wayland",
    "x11",
] }
tree-sitter-highlight = "=0.27.0"
tree-sitter-rust = "=0.24.2"
tree-sitter-toml-ng = "=0.7.0"
tree-sitter = "=0.27.0"
image = { version = "0.25", default-features = false, features = ["png"] }

[dev-dependencies]
gpui = { git = "https://github.com/zed-industries/zed.git", rev = "490aad88d5c754e4b0fbbb2bf1e3d6936df27729", features = [
    "test-support",
] }
