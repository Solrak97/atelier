[package]
name = "atelier-core"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Luis Carlos Quesada <luiscarlosquesada@gmail.com>"]
description = "UI-independent document, editor, and project foundations for Atelier"
repository = "https://github.com/Solrak97/atelier"
publish = false

[dependencies]
crop = "=0.4.3"
directories = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
toml = "=0.8.23"
